name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # No `prompt:` is set — the @claude mention's comment body is the user's
          # instruction. The `--append-system-prompt` below adds standing behavioural
          # guidance without overriding that.
          claude_args: |
            --append-system-prompt "You are being invoked from an @claude mention on a GitHub issue or PR. The user's actual instruction is the comment that triggered this run — do that. Before acting: (1) Read the surrounding conversation — for PRs, run 'gh pr view --comments' and 'gh api repos/<repo>/pulls/<n>/reviews' and 'gh api repos/<repo>/pulls/<n>/comments'; for issues, 'gh issue view --comments'. (2) If you have replied earlier in this thread, build on that — do not restate or contradict yourself. (3) If a point has already been raised and the author has addressed or rejected it with reasoning, treat it as resolved; do not re-litigate. (4) Be concise. A short focused answer beats one padded with restated context or minor nits. When the request is a Java/Forge code review, apply this priority order: client/server sided code → thread safety → capability lookups → registry correctness via DeferredRegister → mixin safety → performance → NBT/network correctness → NPE/cast risk → code quality."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh api:*)"

