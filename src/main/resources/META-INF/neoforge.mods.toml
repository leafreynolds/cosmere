modLoader = "javafml"
loaderVersion = "${loader_version}"
issueTrackerURL = "https://github.com/cosmere/Cosmere/issues"
license = "MIT"

[[mods]]
modId = "cosmere"
version = "${version}"
displayName = "Cosmere"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/cosmere/"
authors = "Leafy"
credits = '''

Ridanisaurus - For many item and block textures.
'''
logoFile = "logo.png"
description = '''Cosmere is a library mod, meant to be used with it's modules that add features from Brandon Sanderson's Cosmere universe.'''

[[dependencies.cosmere]]
modId = "minecraft"
type = "required"
versionRange = "${mc_version}"
side = "BOTH"
[[dependencies.cosmere]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version}"
side = "BOTH"
[[dependencies.cosmere]]
modId = "curios"
type = "required"
versionRange = "${curios_version}"
ordering = "AFTER"
side = "BOTH"
[[dependencies.cosmere]]
modId = "patchouli"
type = "optional"
versionRange = "${patchouli_version}"
ordering = "AFTER"
side = "BOTH"
[[dependencies.cosmere]]
modId = "jei"
type = "optional"
versionRange = "${jei_version}"
ordering = "AFTER"
side = "BOTH"
[[dependencies.cosmere]]
modId = "jade"
type = "optional"
versionRange = "${jade_version}"
ordering = "AFTER"
side = "BOTH"