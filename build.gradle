neoForge {
	version = project.neoforge_version

	parchment {
		minecraftVersion = project.parchment_minecraft
		mappingsVersion = project.parchment_version
	}

	accessTransformers.from(
			file('src/main/resources/META-INF/accesstransformer.cfg'),
			file('src/allomancy/resources/META-INF/accesstransformer.cfg'),
			file('src/surgebinding/resources/META-INF/accesstransformer.cfg')
	)

	// MDG 2.x only attaches the Minecraft/NeoForge/Parchment classpath to sourceSets.main implicitly.
	// Every other source set in the mod (api, each submodule, and every datagen/gameTest extra) must
	// opt in — otherwise compile<SourceSet>Java fails with "package net.minecraft.* does not exist".
	addModdingDependenciesTo sourceSets.api
	addModdingDependenciesTo sourceSets.datagenMain
	addModdingDependenciesTo sourceSets.gameTestMain
	for (def name : secondaryModules) {
		addModdingDependenciesTo sourceSets.getByName(name)
		addModdingDependenciesTo getExtraSourceSet(name, 'datagen')
		addModdingDependenciesTo getExtraSourceSet(name, 'gameTest')
	}

	def gameTestNamespaces = 'cosmere,allomancy,feruchemy,hemalurgy,surgebinding,sandmastery,cosmeretools'

	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
			if (project.hasProperty('mc_uuid')) {
				programArguments.addAll '--uuid', project.getProperty('mc_uuid')
			}
			if (project.hasProperty('mc_username')) {
				programArguments.addAll '--username', project.getProperty('mc_username')
			}
			if (project.hasProperty('mc_accessToken')) {
				programArguments.addAll '--accessToken', project.getProperty('mc_accessToken')
			}
			if (project.hasProperty('forge_force_ansi')) {
				jvmArguments.add "-Dterminal.ansi=${project.getProperty('forge_force_ansi')}"
			}
		}
		server {
			server()
			systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
		}
		gameTestServer {
			type = 'gameTestServer'
			systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
		}
		data {
			data()
			def dataArgs = ['--all',
			                '--output', file('src/datagen/generated/').absolutePath,
			                '--mod', 'cosmere',
			                '--existing', file('src/main/resources/').absolutePath]
			for (def name : secondaryModules) {
				dataArgs.add('--mod'); dataArgs.add(name)
				dataArgs.add('--existing'); dataArgs.add(file("src/${name}/resources/").absolutePath)
			}
			programArguments.addAll dataArgs
		}
	}

	mods {
		cosmere {
			sourceSet sourceSets.api
			sourceSet sourceSets.main
			sourceSet sourceSets.datagenMain
			sourceSet sourceSets.gameTestMain
		}
		for (def name : secondaryModules) {
			create(name) {
				sourceSet sourceSets.getByName(name)
				sourceSet getExtraSourceSet(name, 'datagen')
				sourceSet getExtraSourceSet(name, 'gameTest')
			}
		}
	}
}


